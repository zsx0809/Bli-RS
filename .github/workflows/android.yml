name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (aarch64, no Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Setup Android SDK tools (aapt2 / zipalign / apksigner)
        run: |
          # ubuntu-latest 自带 Android SDK commandline-tools 与 build-tools
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          ls "$ANDROID_HOME/build-tools" || true

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Skia 预编译包很大，缓存住能省掉重复下载与编译
          cache-on-failure: true

      - name: Build .so
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          NDK_BIN: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
        run: |
          # rustc 只知道 linker；C 依赖（ring / skia）由 cc-rs 驱动，
          # 它需要 CC_/AR_ 环境变量，否则会去找 PATH 里不存在的
          # `aarch64-linux-android-clang` 然后直接失败。
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$NDK_BIN/llvm-ar"

          ls "$NDK_BIN" | grep aarch64 | head

          cargo build --lib --release --target aarch64-linux-android

      - name: Package APK
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-35/android.jar
          # CI 用官方 NDK 链接，DT_NEEDED 已正确，不需要 patchelf
          SKIP_PATCHELF: "1"
        run: |
          LIBCXX=$(find ${{ steps.ndk.outputs.ndk-path }} -name 'libc++_shared.so' -path '*aarch64-linux-android*' | head -1)
          echo "libc++_shared: $LIBCXX"

          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          LIBCXX_SO="$LIBCXX" bash scripts/package_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bli-RS-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
