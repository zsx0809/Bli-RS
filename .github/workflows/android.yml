name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (aarch64, no Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Setup Android SDK tools (aapt2 / zipalign / apksigner)
        run: |
          # ubuntu-latest 自带 Android SDK commandline-tools 与 build-tools
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          ls "$ANDROID_HOME/build-tools" || true

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Skia 预编译包很大，缓存住能省掉重复下载与编译
          cache-on-failure: true

      - name: Build .so
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
        run: |
          cargo build --lib --release --target aarch64-linux-android

      - name: Package APK
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-35/android.jar
        run: |
          # package_apk.sh 里的路径是 Termux 硬编码的，这里做一次等价替换
          sed -i 's#/data/data/com.termux/files/usr/bin/##g' scripts/package_apk.sh
          sed -i "s#/data/data/com.termux/files/home/Android/Sdk#$ANDROID_HOME#g" scripts/package_apk.sh
          sed -i "s#/data/data/com.termux/files/usr/lib/libc++_shared.so#$(find ${{ steps.ndk.outputs.ndk-path }} -name 'libc++_shared.so' -path '*aarch64-linux-android*' | head -1)#g" scripts/package_apk.sh

          # CI 上不需要 patchelf 修 DT_NEEDED：NDK 的 clang 已经正确链接
          sed -i '/patchelf/d' scripts/package_apk.sh

          # 生成 debug keystore
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" || true

          bash scripts/package_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bli-RS-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
