[workspace]

[package]
name = "bli-rs"
version = "0.1.0"
edition = "2021"
authors = ["zsx0809"]
description = "High performance, zero-bloat Bilibili client written in pure Rust"
license = "GPL-3.0-only"

[lib]
name = "bli_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bli-rs"
path = "src/main.rs"

[dependencies]
slint = { version = "1.9", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
log = "0.4"

[build-dependencies]
slint-build = "1.9"

[package.metadata.android]
package = "com.bli.rs"
apk_label = "Bli-RS"
build_targets = ["aarch64-linux-android"]
min_sdk_version = 26
target_sdk_version = 34
assets = "assets"

[package.metadata.android.application]
icon = "@mipmap/ic_launcher"
label = "Bli-RS"
theme = "@android:style/Theme.NoTitleBar.Fullscreen"
