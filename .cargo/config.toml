# ==============================================================================
# Cargo 目标配置
#
# linker 只在 Termux 原生环境需要显式指定（宿主的 cc 不是 Android 目标）。
# 在 CI（ubuntu-latest + 官方 NDK）上，Rust 会自动按 NDK 里的 clang 命名去找
# aarch64-linux-android26-clang，**不能**写死 Termux 的绝对路径 ——
# 那会让 CI 报 `failed to find tool "aarch64-linux-android-clang"`。
#
# 因此这里用 env 变量做开关：
#   本地 Termux：export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=/data/data/com.termux/files/usr/bin/clang
#   CI：什么都不用设，NDK 的 clang 由 cc-rs / rustc 自动发现
# ==============================================================================

[net]
git-fetch-with-cli = true

[http]
multiplexing = false
timeout = 120
