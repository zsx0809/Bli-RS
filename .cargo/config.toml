# ==============================================================================
# chroot 内交叉编译到 Android (aarch64)
#
# 关键事实：
# 1. Google 官方 NDK 只有 linux-x86_64 版本，没有 aarch64 host；
#    所以 chroot（aarch64 glibc）无法使用官方 NDK。
# 2. Termux 自带的 clang 本身就是 aarch64-unknown-linux-android24 目标，
#    且能在 chroot 内直接执行（Android 内核 + bionic 动态链接器可用），
#    因此直接把它当作 Android 交叉链接器。
# 3. Rust 侧用 rustup 的 aarch64-linux-android std（chroot 已安装）。
# ==============================================================================

[target.aarch64-linux-android]
linker = "/data/data/com.termux/files/usr/bin/clang"

[net]
git-fetch-with-cli = true

[http]
multiplexing = false
timeout = 120
